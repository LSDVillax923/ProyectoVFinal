spring.application.name=demo

server.port = 8080
#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
spring.datasource.url=jdbc:h2:file:./mydatabase
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8090/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop
#spring.sql.init.mode=

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imrime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson (formato de fechas en JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Bogota

# Ignorar propiedades de Hibernate que son proxies no inicializados
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Subida de archivos (fotos de mascotas)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta destino para imágenes de mascotas (relativa al working dir del proceso Spring)
app.uploads.mascotas-dir=src/main/resources/static/img

# ───────────────────────────────────────────────────────────────────────────
# Recuperación de contraseña (email)
# ───────────────────────────────────────────────────────────────────────────
# URL del frontend que arma el link del email: ${app.frontend-url}/inicio/reset-password?token=...
app.frontend-url=http://localhost:4200
# Minutos que vive un token de reset antes de expirar
app.password-reset.expiration-minutes=30

# SMTP — completa con las credenciales del proveedor que prefieras.
# Las variables de entorno tienen prioridad sobre el valor por defecto: por seguridad
# nunca commitees credenciales reales en este archivo.
#
# Gmail (con App Password — no la contraseña de la cuenta):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=tuemail@gmail.com
#   spring.mail.password=xxxxxxxxxxxxxxxx     (16 chars, generado en https://myaccount.google.com/apppasswords)
#   spring.mail.properties.mail.smtp.starttls.enable=true
#
# Mailtrap (sandbox para desarrollo — recomendado para no enviar a usuarios reales):
#   spring.mail.host=sandbox.smtp.mailtrap.io
#   spring.mail.port=2525
#   spring.mail.username=<MAILTRAP_USERNAME>
#   spring.mail.password=<MAILTRAP_PASSWORD>
#
# Si las dejas en blanco el envío fallará y verás el link de reset en la consola
# del backend (útil para dev cuando todavía no hay SMTP configurado).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
