<section class="box">
  <h2>Crear nueva contraseña</h2>

  <p *ngIf="!tokenAusente">Ingresa una nueva contraseña para tu cuenta. El link es válido por 30 minutos.</p>

  <p *ngIf="mensaje" class="flash-message flash-message-success">{{ mensaje }}</p>
  <p *ngIf="error" class="flash-message flash-message-error">{{ error }}</p>

  <form *ngIf="!tokenAusente && !mensaje" (ngSubmit)="cambiarContrasenia()" #resetForm="ngForm">
    <label for="nuevaContrasenia">Nueva contraseña</label>
    <input
      id="nuevaContrasenia"
      type="password"
      name="nuevaContrasenia"
      placeholder="Mínimo 4 caracteres"
      [(ngModel)]="nuevaContrasenia"
      required
      minlength="4"
      autocomplete="new-password"
    />

    <label for="confirmacion">Confirmar contraseña</label>
    <input
      id="confirmacion"
      type="password"
      name="confirmacion"
      placeholder="Repite la contraseña"
      [(ngModel)]="confirmacion"
      required
      minlength="4"
      autocomplete="new-password"
    />

    <button type="submit" [disabled]="resetForm.invalid || enviando">
      {{ enviando ? 'Guardando...' : 'Cambiar contraseña' }}
    </button>
  </form>

  <a routerLink="/inicio/login" class="back">← Volver a Iniciar Sesión</a>
</section>
